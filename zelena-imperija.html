<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зелена Империја — Green Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════
   ЗЕЛЕНА ИМПЕРИЈА — визуелен систем од Claude Design пакетот
   (светла oklch тема · Outfit/Inter · SVG иконографија)
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:oklch(97% 0.015 95);font-family:Inter,system-ui,sans-serif;
  color:oklch(27% 0.02 150);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed}
::-webkit-scrollbar{display:none}

@keyframes leafSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes shimmerSweep{0%{transform:translateX(-160%)}100%{transform:translateX(220%)}}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-60px)}}
@keyframes toastSlideIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:translateX(0)}}
@keyframes modalPop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes ringPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spinPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@keyframes dustDrift{0%{transform:translate(0,0)}100%{transform:translate(6px,-14px)}}
@keyframes panelIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01s !important;animation-iteration-count:1 !important}
}

/* ── Заглавие ── */
.zaglavje{position:sticky;top:0;z-index:30;background:#fff;
  border-bottom:1px solid oklch(90% 0.02 90);padding:10px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:Outfit,sans-serif;font-weight:800;font-size:18px;letter-spacing:.2px;
  background:linear-gradient(90deg,oklch(38% 0.06 152),oklch(66% 0.15 55));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.jazik{display:flex;gap:2px;background:oklch(94% 0.015 90);border-radius:20px;padding:3px}
.jazik button{padding:4px 10px;border-radius:16px;font:700 10.5px Inter,sans-serif;
  color:oklch(50% 0.02 150);transition:background .2s,color .2s}
.jazik button.aktivno{background:oklch(60% 0.11 152);color:#fff}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{display:flex;align-items:center;gap:6px;background:oklch(94% 0.015 90);
  border-radius:12px;padding:6px 11px}
.chip b{font:800 14px Outfit,sans-serif;line-height:1.1;white-space:nowrap}
.chip small{font:600 8px Inter,sans-serif;color:oklch(60% 0.02 150);
  text-transform:uppercase;letter-spacing:.4px;display:block}
.chip svg{color:oklch(66% 0.15 55);flex-shrink:0}
.chip.prestiz{background:linear-gradient(135deg,#16241c,#0c1310);
  border:1px solid rgba(251,191,36,.4)}
.chip.prestiz b{color:#fbbf24}
.xp-lenta{height:4px;background:oklch(88% 0.02 90);border-radius:2px;margin-top:3px;
  overflow:hidden;min-width:64px}
.xp-lenta>i{display:block;height:100%;background:oklch(55% 0.14 320);transition:width .4s ease}
.okrugla{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:oklch(94% 0.015 90);color:oklch(40% 0.02 150);flex-shrink:0}
.okrugla:hover{background:oklch(90% 0.02 90)}

/* ── Навигација ── */
.navig{display:flex;justify-content:center;padding:7px 12px;background:#fff;
  border-bottom:1px solid oklch(90% 0.02 90)}
.navig-vnatre{display:flex;gap:4px;max-width:1000px;width:100%;overflow-x:auto}
.navig button{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:8px 5px;border-radius:12px;color:oklch(45% 0.02 150);
  font:700 9.5px Inter,sans-serif;transition:background .2s,color .2s;white-space:nowrap;position:relative}
.navig button.aktivno{background:oklch(60% 0.11 152);color:#fff}
.navig .tocka{position:absolute;top:5px;right:9px;width:7px;height:7px;border-radius:50%;
  background:#ef4444;display:none}
.navig .tocka.vidliva{display:block}

main{animation:panelIn .35s ease both}
.panel{max-width:1120px;margin:0 auto;padding:16px 18px 50px}
.panel.tesen{max-width:940px}
.naslov{font:800 18px Outfit,sans-serif;margin-bottom:4px}
.podnaslov{font:500 12.5px Inter,sans-serif;color:oklch(50% 0.02 150);
  margin-bottom:16px;max-width:560px;line-height:1.6}
.sekcija{font:700 12px Outfit,sans-serif;text-transform:uppercase;letter-spacing:.3px;margin:0 0 8px}

/* ── Амбиент банер ── */
.ambient{position:relative;overflow:hidden;border-radius:16px;padding:14px 18px;
  margin-bottom:16px;display:flex;align-items:center;gap:10px;transition:background 2s ease;min-height:20px}
.ambient .pravlivka{position:absolute;width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.3)}
.ambient span{position:relative;font:700 12px Inter,sans-serif;color:#e9f3ec}
.ambient svg{position:relative;flex-shrink:0;transition:color 1.5s ease}

/* ── Картички ── */
.kart{background:#fff;border:1px solid oklch(90% 0.02 90);border-radius:14px;padding:14px}
.kart-mreza{display:grid;gap:10px}
.lenta-h{height:5px;background:oklch(92% 0.02 90);border-radius:3px;overflow:hidden}
.lenta-h>i{display:block;height:100%;transition:width .4s ease}
.badge{font:800 8.5px Inter,sans-serif;letter-spacing:.4px;padding:3px 8px;
  border-radius:20px;white-space:nowrap}
.pil{font:800 10px Inter,sans-serif;background:oklch(92% 0.06 152);
  color:oklch(35% 0.08 152);padding:5px 11px;border-radius:20px}

/* ── Копчиња ── */
.k-primarno{padding:9px 14px;border-radius:10px;font:800 11px Outfit,sans-serif;
  background:oklch(38% 0.06 152);color:#fff}
.k-primarno:disabled{opacity:.55}
.k-sekundarno{padding:8px;font:700 10.5px Inter,sans-serif;border-radius:9px;
  background:oklch(94% 0.015 90);color:oklch(30% 0.02 150)}
.k-voda{padding:8px;font:700 10.5px Inter,sans-serif;border-radius:9px;
  background:oklch(93% 0.03 230);color:oklch(38% 0.08 230)}
.k-voda:hover{background:oklch(89% 0.05 230)}
.k-hrana{padding:8px;font:700 10.5px Inter,sans-serif;border-radius:9px;
  background:oklch(92% 0.04 152);color:oklch(35% 0.07 152)}
.k-hrana:hover{background:oklch(87% 0.06 152)}
.k-zlatno{padding:10px;font:800 11.5px Outfit,sans-serif;border-radius:10px;
  background:linear-gradient(135deg,oklch(70% 0.14 55),oklch(62% 0.15 40));color:#fff}
.k-crveno{padding:9px;font:700 10.5px Inter,sans-serif;border-radius:10px;
  background:oklch(93% 0.04 25);color:oklch(45% 0.15 25)}
.k-crveno:hover{background:oklch(89% 0.06 25)}

/* ── Растенија ── */
.rast-mreza{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rast-kart{background:#fff;border:1px solid oklch(90% 0.02 90);border-radius:16px;
  overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  transition:transform .2s ease,box-shadow .2s ease}
.rast-kart:hover{transform:translateY(-3px);
  box-shadow:0 6px 10px rgba(0,0,0,.06),0 16px 30px rgba(0,0,0,.09)}
.rast-glava{padding:11px 12px 0;display:flex;justify-content:space-between;align-items:center;gap:6px}
.rast-ime{font:700 11.5px Outfit,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rast-scena{margin:10px 12px 0;height:150px;border-radius:11px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#16241c 0%,#0c1310 60%,#3d2717 60%,#20160c 100%)}
.rast-scena svg{position:absolute;inset:0;width:100%;height:100%}
.rast-sjaj{position:absolute;left:50%;top:44%;width:120px;height:120px;
  transform:translate(-50%,-50%);border-radius:50%;transition:opacity .8s ease;
  animation:glowPulse 3s ease-in-out infinite}
.rast-njise{transform-origin:50% 100%;animation:leafSway 6s ease-in-out infinite alternate}
.rast-telo{transform-origin:50% 100%;transition:transform .8s ease}
.rast-telo g{transition:opacity .8s ease}
.vnimanie{position:absolute;inset:0;border-radius:11px;border:2px solid #ef4444;
  animation:ringPulse 1.6s ease-in-out infinite;pointer-events:none}
.plovka{position:absolute;left:50%;top:40%;transform:translateX(-50%);
  font:800 15px Outfit,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.5);
  animation:floatUp 1.3s ease-out forwards;pointer-events:none}
.rast-lenti{padding:9px 12px 0;display:flex;flex-direction:column;gap:4px}
.rast-lenta{display:flex;align-items:center;gap:6px;font:600 9.5px Inter,sans-serif;
  color:oklch(55% 0.02 150)}
.rast-lenta svg{flex-shrink:0}
.rast-lenta .zica{flex:1;height:5px;background:oklch(92% 0.02 90);border-radius:3px;overflow:hidden}
.rast-lenta .zica>i{display:block;height:100%;transition:width .4s ease,background .4s}
.rast-lenta u{text-decoration:none;width:20px;text-align:right}
.rast-akcii{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px 12px}
.berba-obvivka{grid-column:1/-1;position:relative;overflow:hidden;border-radius:10px}
.berba-obvivka .svetkanje{position:absolute;top:0;left:0;width:36%;height:100%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.65),transparent);
  animation:shimmerSweep 2.6s ease-in-out infinite;pointer-events:none}
.k-berba{width:100%;padding:10px;font:800 11.5px Outfit,sans-serif;border-radius:10px}
.prazen-slot{min-height:288px;border:2px dashed oklch(85% 0.02 90);border-radius:16px;
  display:flex;align-items:center;justify-content:center;background:oklch(97% 0.01 95);
  color:oklch(60% 0.02 150);font:700 12.5px Outfit,sans-serif;
  transition:background .2s,border-color .2s,color .2s}
.prazen-slot:hover{background:oklch(94% 0.04 152);border-color:oklch(60% 0.11 152);
  color:oklch(38% 0.06 152)}

/* ── Соби ── */
.sobi{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.soba{flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  padding:10px 14px;border-radius:12px;min-width:160px;background:oklch(94% 0.015 90);
  color:oklch(27% 0.02 150);transition:background .2s,color .2s;text-align:left}
.soba.aktivna{background:oklch(38% 0.06 152);color:#fff}
.soba.zakl{background:oklch(96% 0.01 90);color:oklch(55% 0.02 150);
  border:1px dashed oklch(80% 0.02 90)}
.soba b{font:700 12px Outfit,sans-serif}
.soba span{font:600 10px Inter,sans-serif;opacity:.8;display:flex;align-items:center;gap:4px}

/* ── Тостови и модали ── */
.tostovi{position:fixed;top:64px;right:14px;z-index:60;display:flex;
  flex-direction:column;gap:8px;max-width:290px}
.tost{background:#16241c;color:#e9f3ec;border:1px solid rgba(251,191,36,.5);
  border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastSlideIn .4s ease both}
.tost .zn{width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#fbbf24,#d97706);display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.tost small{font:700 8.5px Inter,sans-serif;text-transform:uppercase;
  letter-spacing:.4px;color:#fbbf24;display:block}
.tost b{font:700 12.5px Outfit,sans-serif}
.tost.obicen{border-color:rgba(74,222,128,.4)}
.tost.greska{border-color:rgba(239,68,68,.55)}

.pokrivka{position:fixed;inset:0;background:rgba(10,15,12,.6);backdrop-filter:blur(3px);
  z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.pokrivka.otvorena{display:flex}
.modal-bel{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:26px;
  animation:modalPop .3s ease both;box-shadow:0 30px 80px rgba(0,0,0,.4);
  max-height:80vh;overflow-y:auto}
.modal-temен,.modal-temen{background:linear-gradient(160deg,#16241c,#0c1310);border-radius:20px;
  max-width:360px;width:100%;padding:28px;text-align:center;color:#e9f3ec;
  animation:modalPop .35s ease both;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal-naslov{font:800 16px Outfit,sans-serif;margin-bottom:8px}
.modal-telo{font:500 13px Inter,sans-serif;color:oklch(45% 0.02 150);
  line-height:1.6;margin-bottom:18px}
.izbor-red{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:oklch(97% 0.01 95);text-align:left;width:100%;margin-bottom:7px}
.izbor-red:hover{background:oklch(93% 0.04 152)}
.gtocka{width:9px;height:9px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>

<header class="zaglavje">
  <div class="logo" id="h-logo">ЗЕЛЕНА ИМПЕРИЈА</div>
  <div class="jazik">
    <button id="jaz-mk" class="aktivno">MK</button>
    <button id="jaz-en">EN</button>
  </div>
  <div class="hud">
    <div class="chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v10M9.5 9.2c0-1.2 1.1-2.2 2.5-2.2s2.5 1 2.5 2.1c0 3-5 1.9-5 4.9 0 1.2 1.1 2.2 2.5 2.2s2.5-1 2.5-2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div><b id="h-pari">0</b><small id="h-pari-l">Денари</small></div>
    </div>
    <div class="chip"><div style="min-width:64px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px">
        <b id="h-nivo">1</b><small id="h-nivo-l">Ниво</small></div>
      <div class="xp-lenta"><i id="h-xp" style="width:2%"></i></div>
    </div></div>
    <div class="chip"><div><b id="h-den">1</b><small id="h-den-l">Ден</small></div></div>
    <div class="chip prestiz" id="h-prestiz-chip" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="color:#fbbf24"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <b id="h-prestiz">0</b>
    </div>
    <button class="okrugla" id="k-zvuk" title="звук">
      <svg id="zvuk-on" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 8.5c1.2 1 1.2 5.9 0 7M19.5 6c2.3 2.2 2.3 9.7 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg id="zvuk-off" width="15" height="15" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 9l4 6M21 9l-4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="okrugla" id="k-tutorial" title="?">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.9.4-1.3.9-1.3 1.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r=".9" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<nav class="navig"><div class="navig-vnatre" id="navig"></div></nav>
<main id="glavno"></main>
<div class="tostovi" id="tostovi"></div>
<div class="pokrivka" id="pokrivka"><div id="pokrivka-sodrzina" style="max-width:420px;width:100%"></div></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   1. ПОДАТОЦИ — буквално од дизајн-пакетот (game-data.js)
   ═══════════════════════════════════════════════════════════════ */
const SORTI = [
  {id:'ohrid_crystal', imeMk:'Охридски Кристал', imeEn:'Ohrid Crystal', tier:1, growSec:55, prinos:6, cena:10, nivo:1, sjaj:'#fbbf24'},
  {id:'pelister_frost', imeMk:'Пелистерски Мраз', imeEn:'Pelister Frost', tier:1, growSec:65, prinos:7, cena:11, nivo:1, sjaj:'#93c5fd'},
  {id:'vardar_gold', imeMk:'Вардарско Злато', imeEn:'Vardar Gold', tier:2, growSec:90, prinos:9, cena:16, nivo:3, sjaj:'#fbbf24'},
  {id:'skopje_haze', imeMk:'Скопска Измаглица', imeEn:'Skopje Haze', tier:2, growSec:100, prinos:8, cena:18, nivo:4, sjaj:'#c4b5fd'},
  {id:'bitola_kush', imeMk:'Битолски Куш', imeEn:'Bitola Kush', tier:3, growSec:130, prinos:11, cena:26, nivo:6, sjaj:'#86efac'},
  {id:'shar_diesel', imeMk:'Шарпланински Дизел', imeEn:'Shar Diesel', tier:3, growSec:140, prinos:10, cena:29, nivo:7, sjaj:'#60a5fa'},
  {id:'galicica_dream', imeMk:'Галичица Сон', imeEn:'Galicica Dream', tier:4, growSec:170, prinos:13, cena:40, nivo:9, sjaj:'#c084fc'},
  {id:'prespa_punch', imeMk:'Преспански Удар', imeEn:'Prespa Punch', tier:4, growSec:180, prinos:12, cena:44, nivo:10, sjaj:'#fb923c'},
  {id:'macedonian_royal', imeMk:'Македонски Кралски', imeEn:'Macedonian Royal', tier:5, growSec:220, prinos:16, cena:60, nivo:13, sjaj:'#fbbf24'},
  {id:'imperial_reserve', imeMk:'Империјална Резерва', imeEn:'Imperial Reserve', tier:5, growSec:240, prinos:15, cena:68, nivo:15, sjaj:'#f472b6'},
];

const POZNATI_HIBRIDI = {
  'ohrid_crystal|vardar_gold': {imeMk:'Кристално Злато', imeEn:'Crystal Gold', sjaj:'#fbbf24'},
  'bitola_kush|shar_diesel': {imeMk:'Планински Гром', imeEn:'Mountain Thunder', sjaj:'#60a5fa'},
  'galicica_dream|macedonian_royal': {imeMk:'Кралски Сон', imeEn:'Royal Dream', sjaj:'#c084fc'},
};
const HIBRID_IMINJA = {
  preMk:['Кристална','Планинска','Златна','Ноќна','Дивска','Империјална','Мистична','Сончева'],
  sufMk:['Магија','Искра','Мечта','Бура','Роса','Круна','Тајна','Светлина'],
  preEn:['Crystal','Mountain','Golden','Midnight','Wild','Imperial','Mystic','Solar'],
  sufEn:['Magic','Spark','Dream','Storm','Dew','Crown','Secret','Glow'],
};
function napraviHibrid(a, b, seme){
  const kluc = [a.id,b.id].sort().join('|');
  const sig = POZNATI_HIBRIDI[kluc];
  const prinos = Math.round(((a.prinos+b.prinos)/2)*1.15);
  const cena = Math.round(((a.cena+b.cena)/2)*1.2);
  const growSec = Math.round((a.growSec+b.growSec)/2);
  const nivo = Math.max(a.nivo,b.nivo);
  const tier = Math.min(5, Math.max(a.tier,b.tier));
  if (sig) return {id:'hybrid_'+kluc, imeMk:sig.imeMk, imeEn:sig.imeEn, tier,
    growSec:Math.round(growSec*0.92), prinos:prinos+2, cena:cena+6, nivo, sjaj:sig.sjaj, hibrid:true};
  const pi = seme % HIBRID_IMINJA.preMk.length;
  const si = (seme*7+3) % HIBRID_IMINJA.sufMk.length;
  return {id:'hybrid_'+kluc+'_'+seme,
    imeMk:HIBRID_IMINJA.preMk[pi]+' '+HIBRID_IMINJA.sufMk[si],
    imeEn:HIBRID_IMINJA.preEn[pi]+' '+HIBRID_IMINJA.sufEn[si],
    tier, growSec, prinos, cena, nivo, sjaj:'#c084fc', hibrid:true};

  VODA_PAD: 100/45, HRANA_PAD: 100/75,               // по секунда
  // Сушење/зреење: 1 ден на сушење = 6 реални секунди
  SUSEN_DEN_SEK: 6, VLAGA_START: 75, VLAGA_PAD_DEN: 7.2, VLAGA_PAD_VLAZEN: 4.0,

  MUVLA_PRAG: 60, MUVLA_SANSA_DEN: 0.10, MUVLA_ZAGUBA_DEN: 0.06, MUVLA_CISTENJE: 0.08,

};

/* ═══════════════════════════════════════════════════════════════
   3. СОСТОЈБА
   ═══════════════════════════════════════════════════════════════ */
let s = novaIgra();
let prikazPari = 500, prikazXp = 0;
let sledenId = 1;
let personalAkumulator = {};
let sejvAkumulator = 0;
let audioCtx = null;

function novaIgra(){
  return {
    verzija: KONFIG.VERZIJA, jazik:'mk', zvuk:true,
    aktivnoJazice:'grow', aktivnaSoba:'starter',
    pari: KONFIG.POCETNI_PARI, xp:0, nivo:1, prestiz:0,
    den:1, sekVoDen:0,
    sobi:{ starter:{otklucena:true, lampa:0}, greenhouse:{otklucena:false, lampa:0}, breeding_lab:{otklucena:false} },
    rastenija:[], sledenRastenieId:1,
    susara:[],                       // серии на сушење и зреење
    zaliha:{},                       // strainId -> parcinja
    hibridi:[], otkrieni:[],
    personal:{ waterer:false, feeder:false, harvester:false, trader:false },
    dostignuvanja:[],
    naracki:[], slednaNarackaId:1, nastanTajmer:60,
    dnevno:{ berba:0, zaraboteno:0, voda:0, hrana:0, prodadeno:0, naracki:0 },
    predizvici:[],
    statistika:{ vkupnoBerbi:0, vkupnoZaraboteno:0, vkupnoPoleano:0, vkupnoNahraneto:0,
      hibridiOtkrieni:0, vraboteni:0, naracki:0, preradjanja:0, sekundiIgrano:0, berbiPoSorta:{} },
    aktivenNastan:null, prodazenBonus:null,
    tutorial:true, tutorialCekor:0,
  };
}

/* ═══════════════════════════════════════════════════════════════
   4. ПОМОШНИ
   ═══════════════════════════════════════════════════════════════ */
const stegni = (v,min,max)=>Math.min(max,Math.max(min,v));
const esc = t => String(t).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n=Math.round(n||0); return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); };
const fmtK = n => { n=Math.round(n||0);
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(Math.abs(n)>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
  return String(n); };
const xpZaNivo = nivo => Math.round(140*Math.pow(nivo,1.32));
const bojaZaPct = p => p>=60 ? '#22c55e' : p>=30 ? '#f59e0b' : '#ef4444';
const fmtVreme = sek => { sek=Math.round(sek||0);
  const h=Math.floor(sek/3600), m=Math.floor((sek%3600)/60);
  return h>0 ? h+'h '+m+'m' : m+'m'; };
const T = () => STR[s.jazik] || STR.mk;
const sablon = (t, ...args) => t.replace(/\{(\d)\}/g, (_,i)=>args[+i]);

function siteSorti(){ return [...SORTI, ...s.hibridi]; }
function sorta(id){ return siteSorti().find(x=>x.id===id) ||
  {imeMk:'—',imeEn:'—',sjaj:'#999',cena:0,tier:1,prinos:1,growSec:60,nivo:1}; }
function imeSorta(x){ return s.jazik==='mk' ? x.imeMk : x.imeEn; }
function otklucenaSorta(x){ return s.nivo >= x.nivo; }
function otkrieniSorti(){ return siteSorti().filter(x =>
  otklucenaSorta(x) && (!x.hibrid || s.otkrieni.includes(x.id))); }
function lampaNaSoba(id){ const rs=s.sobi[id]; return LAMBI[(rs&&rs.lampa)||0]; }
function prodazenMult(){
  let m = 1 + s.prestiz*0.05;
  if (s.prodazenBonus && s.prodazenBonus.preostanato>0) m *= s.prodazenBonus.mult;
  return m;
}

/* ── Звук (WebAudio, од дизајнот) ── */
function sfx(vid){
  if (!s.zvuk) return;
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){ return; }
  if (!audioCtx) return;
  const sekvenci = {
    click:[[600,.06]], water:[[520,.07],[420,.09]], feed:[[660,.06],[780,.08]],
    harvest:[[523,.09],[659,.09],[784,.09],[1046,.14]],
    levelup:[[523,.12],[659,.12],[784,.22]],
    achievement:[[784,.08],[988,.08],[1175,.2]],
    error:[[160,.18]],
  };
  const seq = sekvenci[vid] || [[440,.08]];
  let t = audioCtx.currentTime;
  for (const [f,d] of seq){
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type = vid==='error' ? 'sawtooth' : 'sine';
    osc.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vid==='error'?.05:.08, t+.01);
    g.gain.exponentialRampToValueAtTime(.001, t+d);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+d+.02);
    t += d*.85;
  }
}

/* ── Тостови ── */
function tost(naslov, ime, klasa){
  const k = document.getElementById('tostovi');
  const el = document.createElement('div');
  el.className = 'tost' + (klasa ? ' '+klasa : '');
  el.innerHTML = `<div class="zn"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="#2a1a00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div>${naslov?`<small>${esc(naslov)}</small>`:''}<b>${esc(ime)}</b></div>`;
  k.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function porака(tekst, greska){ tost('', tekst, greska?'greska':'obicen'); }
const poraka = porака;

/* ── Пари и XP ── */
function dodadiPari(iznos){
  s.pari += iznos;
  if (iznos > 0){ s.statistika.vkupnoZaraboteno += iznos; s.dnevno.zaraboteno += iznos; }
  proveriDostignuvanja();
}
function dodadiXp(iznos){
  if (!Number.isFinite(iznos) || iznos<=0) return;
  s.xp += iznos;
  let krena=false;
  while (s.xp >= xpZaNivo(s.nivo)){ s.xp -= xpZaNivo(s.nivo); s.nivo++; krena=true; }
  if (krena){ sfx('levelup'); osveziNav(); }
  proveriDostignuvanja();
}

/* ═══════════════════════════════════════════════════════════════
   5. АКЦИИ — одгледување
   ═══════════════════════════════════════════════════════════════ */
function premestiJazice(id){
  sfx('click');
  s.aktivnoJazice = id;
  iscrtajSe(true);
}
function premestiSoba(id){
  const rs = s.sobi[id];
  if (!rs || !rs.otklucena){ otklucSoba(id); return; }
  sfx('click'); s.aktivnaSoba=id; iscrtajSe(true);
}
function otklucSoba(id){
  const def = SOBI.find(r=>r.id===id);
  if (s.nivo < def.nivo || s.pari < def.cenaOtklucuvanje){ sfx('error'); return; }
  dodadiPari(-def.cenaOtklucuvanje);
  s.sobi[id] = { otklucena:true, lampa:0 };
  s.aktivnaSoba = id;
  sfx('achievement'); proveriDostignuvanja(); iscrtajSe(true);
}
function nadgradiLampa(){
  const rs = s.sobi[s.aktivnaSoba];
  const sledna = LAMBI[rs.lampa+1];
  if (!sledna || s.pari < sledna.cena){ sfx('error'); return; }
  dodadiPari(-sledna.cena);
  rs.lampa++;
  sfx('achievement'); iscrtajSe(true);
}
function otvoriIzborSorta(sobaId){
  sfx('click');
  const t=T();
  otvoriModal(`<div class="modal-bel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font:800 15px Outfit,sans-serif">${esc(t.picker_title)}</div>
      <button onclick="zatvoriModal()" style="font:700 11.5px Inter,sans-serif;color:oklch(55% 0.02 150)">${esc(t.close)}</button>
    </div>
    ${otkrieniSorti().map(x=>`
      <button class="izbor-red" onclick="zasadi('${esc(sobaId)}','${esc(x.id)}')">
        <span class="gtocka" style="background:${esc(x.sjaj)}"></span>
        <span style="flex:1;font:700 12px Outfit,sans-serif">${esc(imeSorta(x))}</span>
        <span style="font:700 9.5px Inter,sans-serif;color:oklch(55% 0.02 150)">T${x.tier}</span>
      </button>`).join('')}
  </div>`);
}
function zasadi(sobaId, sortaId){
  zatvoriModal();
  const def = SOBI.find(r=>r.id===sobaId);
  if (!def || def.laboratorija) return;
  if (s.rastenija.filter(p=>p.soba===sobaId).length >= def.kapacitet) return;
  if (!otkrieniSorti().some(x=>x.id===sortaId)) return;
  s.rastenija.push({ id:s.sledenRastenieId++, soba:sobaId, sorta:sortaId,
    voda:100, hrana:100, zdravje:100, napredok:0, plovki:[] });
  sfx('click'); iscrtajSe(true);
}
function plovka(rastenieId, tekst, boja){
  const p = s.rastenija.find(x=>x.id===rastenieId);
  if (!p) return;
  p.plovki.push({ id:Math.random(), tekst, boja });
  setTimeout(()=>{ const p2=s.rastenija.find(x=>x.id===rastenieId);
    if (p2) p2.plovki.shift(); }, 1200);
}
function polej(id){
  const p = s.rastenija.find(x=>x.id===id); if (!p) return;
  p.voda = Math.min(100, p.voda+40);
  s.statistika.vkupnoPoleano++; s.dnevno.voda++;
  plovka(id, '+втр', '#60a5fa'); sfx('water'); proveriDostignuvanja();
}
function nahrani(id){
  const p = s.rastenija.find(x=>x.id===id); if (!p) return;
  p.hrana = Math.min(100, p.hrana+40);
  s.statistika.vkupnoNahraneto++; s.dnevno.hrana++;
  plovka(id, '+хрн', '#4ade80'); sfx('feed'); proveriDostignuvanja();
}

/* Берба → избор за подрежување → серија на сушење */
function otvoriIzborTrim(id){
  const p = s.rastenija.find(x=>x.id===id);
  if (!p || p.napredok < 1) return;
  const t=T();
  otvoriModal(`<div class="modal-bel">
    <div class="modal-naslov">${esc(t.trim_q)}</div>
    <button class="izbor-red" onclick="oberi(${id},true)">
      <div><div style="font:700 12.5px Outfit,sans-serif">${esc(t.trim_precise)}</div>
      <div style="font:500 11px Inter,sans-serif;color:oklch(50% 0.02 150)">${esc(t.trim_precise_d)}</div></div>
    </button>
    <button class="izbor-red" onclick="oberi(${id},false)">
      <div><div style="font:700 12.5px Outfit,sans-serif">${esc(t.trim_fast)}</div>
      <div style="font:500 11px Inter,sans-serif;color:oklch(50% 0.02 150)">${esc(t.trim_fast_d)}</div></div>
    </button>
  </div>`);
}
function oberi(id, precizno){
  zatvoriModal();
  const p = s.rastenija.find(x=>x.id===id);
  if (!p || p.napredok < 1) return;
  const x = sorta(p.sorta);
  const lampa = lampaNaSoba(p.soba);
  const zdravMult = 0.5 + (p.zdravje/100)*0.5;
  let parcinja = Math.max(1, Math.round(x.prinos * lampa.prinosMult * zdravMult));
  if (precizno) parcinja = Math.max(1, Math.round(parcinja * KONFIG.TRIM_MASA));

  s.susara.push({ id:sledenId++, sorta:p.sorta, parcinja,
    faza:'sushenje', denovi:0, vlaga:KONFIG.VLAGA_START,
    potkrateno:!!precizno, vrtenja:0, trebaVrtenje:false, vrtenjeRok:0,
    sledenoVrtenje:KONFIG.VRTENJE_INTERVAL,
    muvla:false, imalaMuvla:false, zaguba:0, vlazenDen:false,
    tochnost:0, denoviZreenje:0, burpovi:0, burpDostapen:false });

  s.statistika.vkupnoBerbi++;
  s.statistika.berbiPoSorta[p.sorta] = (s.statistika.berbiPoSorta[p.sorta]||0)+1;
  s.dnevno.berba++;
  s.rastenija = s.rastenija.filter(r=>r.id!==id);
  dodadiXp(Math.round(parcinja*3));
  sfx('harvest'); proveriDostignuvanja(); iscrtajSe(true);
}

/* ── Сушење и зреење ── */
function najdiSerija(id){ return s.susara.find(x=>x.id===id); }
function zavrtiGranki(id){
  const b = najdiSerija(id);
  if (!b || b.faza!=='sushenje' || !b.trebaVrtenje) return;
  b.trebaVrtenje=false; b.vrtenja++;
  poraka(T().t_turned); sfx('click'); iscrtajSe(true);
}
function provetri(id){
  const b = najdiSerija(id);
  if (!b || !b.vlazenDen) return;
  b.vlazenDen=false; poraka(T().t_vented); sfx('click'); iscrtajSe(true);
}
function otstraniMuvla(id){
  const b = najdiSerija(id);
  if (!b || !b.muvla) return;
  b.zaguba = Math.min(.6, b.zaguba + KONFIG.MUVLA_CISTENJE);
  b.muvla=false; poraka(T().t_mold_rm); sfx('click'); iscrtajSe(true);
}
function spakuvaj(id){
  const b = najdiSerija(id);
  if (!b || b.faza!=='sushenje' || b.vlaga > KONFIG.VLAGA_TEGLI_MAX){ sfx('error'); return; }
  b.tochnost = b.vlaga < KONFIG.IDEAL_MIN-3 ? .7
             : b.vlaga <= KONFIG.IDEAL_MAX ? 1
             : b.vlaga <= KONFIG.IDEAL_MAX+9 ? .85 : .65;
  b.faza='zreenje'; b.denoviZreenje=0; b.burpovi=0; b.burpDostapen=true;
  b.trebaVrtenje=false; b.vlazenDen=false; b.muvla=false;
  poraka(sablon(T().t_packed, Math.round(b.vlaga)));
  sfx('achievement'); iscrtajSe(true);
}
function burpni(id){
  const b = najdiSerija(id);
  if (!b || b.faza!=='zreenje' || !b.burpDostapen) return;
  b.burpDostapen=false; b.burpovi++;
  poraka(T().t_burp); sfx('feed'); iscrtajSe(true);
}
function zavrsiZreenje(id){
  const b = najdiSerija(id);
  if (!b || b.faza!=='zreenje' || b.denoviZreenje < KONFIG.ZREENJE_MIN){ sfx('error'); return; }
  // Квалитетот на негата станува множител на приносот: совршена нега ×1.15, лоша ×0.7.
  const nega = stegni(
    .55*b.tochnost + .15*Math.min(b.vrtenja,3)/3 + .2*Math.min(b.burpovi,6)/6
    + (b.potkrateno?.1:0) - (b.imalaMuvla?.12:0), 0, 1);
  const finalni = Math.max(1, Math.round(b.parcinja * (1-b.zaguba) * (0.7 + 0.45*nega)));
  s.zaliha[b.sorta] = (s.zaliha[b.sorta]||0) + finalni;
  s.susara = s.susara.filter(x=>x.id!==id);
  poraka(sablon(T().t_cured, finalni));
  sfx('harvest'); iscrtajSe(true);
}

/* ── Генетика ── */
let izborVkrstuvanje = [];
function izberiZaVkrstuvanje(id){
  sfx('click');
  if (izborVkrstuvanje.includes(id)) izborVkrstuvanje = izborVkrstuvanje.filter(x=>x!==id);
  else { if (izborVkrstuvanje.length>=2) izborVkrstuvanje.shift(); izborVkrstuvanje.push(id); }
  iscrtajSe(true);
}
function vkrsti(){
  if (izborVkrstuvanje.length!==2 || s.pari<700){ sfx('error'); return; }
  const a=sorta(izborVkrstuvanje[0]), b=sorta(izborVkrstuvanje[1]);
  const hibrid = napraviHibrid(a, b, Math.floor(Math.random()*997));
  dodadiPari(-700);
  const postoi = siteSorti().some(x=>x.id===hibrid.id);
  if (!postoi){
    s.hibridi.push(hibrid);
    s.otkrieni.push(hibrid.id);
    s.statistika.hibridiOtkrieni++;
  } else if (!s.otkrieni.includes(hibrid.id)) s.otkrieni.push(hibrid.id);
  izborVkrstuvanje = [];
  sfx('achievement'); proveriDostignuvanja();
  const t=T();
  otvoriModal(`<div class="modal-temen">
    <div style="font:700 10.5px Inter,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:#fbbf24;margin-bottom:12px">${esc(t.breed_result)}</div>
    <div style="width:70px;height:70px;border-radius:50%;margin:0 auto 14px;background:radial-gradient(circle,${esc(hibrid.sjaj)},transparent 72%)"></div>
    <div style="font:800 18px Outfit,sans-serif;margin-bottom:4px">${esc(imeSorta(hibrid))}</div>
    <div style="font:600 11px Inter,sans-serif;color:rgba(233,243,236,.6);margin-bottom:22px">Tier ${hibrid.tier} · ${fmt(hibrid.cena)} ден</div>
    <button onclick="zatvoriModal();iscrtajSe(true)" style="padding:11px 26px;border-radius:12px;font:800 12px Outfit,sans-serif;background:linear-gradient(135deg,#fbbf24,#d97706);color:#2a1a00">${esc(t.breed_cta)}</button>
  </div>`);
}

/* ── Пазар ── */
function prodaj(sortaId, kolku){
  const ima = s.zaliha[sortaId]||0;
  kolku = Math.min(kolku, ima);
  if (kolku<=0) return;
  const x = sorta(sortaId);
  let vkupno = 0;
  for (let i=0;i<kolku;i++){
    let m = 1 + s.prestiz*0.05;
    if (s.prodazenBonus && s.prodazenBonus.preostanato>0){
      m *= s.prodazenBonus.mult; s.prodazenBonus.preostanato--;
    }
    vkupno += x.cena*m;
  }
  if (s.prodazenBonus && s.prodazenBonus.preostanato<=0) s.prodazenBonus=null;
  s.zaliha[sortaId] = ima-kolku;
  s.dnevno.prodadeno += kolku;
  dodadiPari(Math.round(vkupno));
  sfx('click'); iscrtajSe(true);
}
function prodajSe(){
  for (const id of Object.keys(s.zaliha)) if (s.zaliha[id]>0) prodaj(id, s.zaliha[id]);
}
function ispolniNaracka(id){
  const n = s.naracki.find(o=>o.id===id); if (!n) return;
  if ((s.zaliha[n.sorta]||0) < n.kolku){ sfx('error'); return; }
  s.zaliha[n.sorta] -= n.kolku;
  s.naracki = s.naracki.filter(o=>o.id!==id);
  s.statistika.naracki++; s.dnevno.naracki++;
  dodadiPari(n.pari); dodadiXp(n.xp);
  sfx('harvest'); proveriDostignuvanja(); iscrtajSe(true);
}
function moznaNaracka(){
  if (s.naracki.length>=3 || Math.random()>0.14) return;
  const bazen = siteSorti().filter(x=>otklucenaSorta(x));
  if (!bazen.length) return;
  const x = bazen[Math.floor(Math.random()*bazen.length)];
  const kolku = 5+Math.floor(Math.random()*15);
  s.naracki.push({ id:s.slednaNarackaId++, sorta:x.id, kolku,
    pari:Math.round(kolku*x.cena*1.4), xp:kolku*3,
    istekuvaDen:s.den+2+Math.floor(Math.random()*2) });
}

/* ── Персонал ── */
function vraboti(kluc){
  const def = PERSONAL.find(p=>p.kluc===kluc);
  if (s.personal[kluc] || s.pari<def.cena){ sfx('error'); return; }
  dodadiPari(-def.cena);
  s.personal[kluc]=true; s.statistika.vraboteni++;
  sfx('achievement'); proveriDostignuvanja(); iscrtajSe(true);
}
function personalRaboti(dt){
  for (const def of PERSONAL){
    if (!s.personal[def.kluc]) continue;
    personalAkumulator[def.kluc] = (personalAkumulator[def.kluc]||0)+dt;
    if (personalAkumulator[def.kluc] < def.sekoi) continue;
    personalAkumulator[def.kluc] = 0;
    if (def.kluc==='waterer'){ const c=s.rastenija.find(p=>p.voda<50); if(c) polej(c.id); }
    else if (def.kluc==='feeder'){ const c=s.rastenija.find(p=>p.hrana<50); if(c) nahrani(c.id); }
    else if (def.kluc==='harvester'){
      const c=s.rastenija.find(p=>p.napredok>=1);
      if (c){ const soba=c.soba, sortaId=c.sorta; oberi(c.id, false);
        // пресади иста сорта ако има место
        const def2=SOBI.find(r=>r.id===soba);
        if (def2 && s.rastenija.filter(p=>p.soba===soba).length < def2.kapacitet)
          s.rastenija.push({ id:s.sledenRastenieId++, soba, sorta:sortaId,
            voda:100, hrana:100, zdravje:100, napredok:0, plovki:[] });
      }
    }
    else if (def.kluc==='trader'){
      const n = s.naracki.find(o=>(s.zaliha[o.sorta]||0)>=o.kolku);
      if (n) ispolniNaracka(n.id);
      else { const k=Object.keys(s.zaliha).filter(x=>s.zaliha[x]>0); if(k.length) prodaj(k[0],1); }
    }
  }
}

/* ── Предизвици ── */
function novPredizvikDen(){
  const bazen = [...PREDIZVICI_BAZEN], izbor = [];
  while (izbor.length<3 && bazen.length)
    izbor.push(bazen.splice(Math.floor(Math.random()*bazen.length),1)[0]);
  s.predizvici = izbor.map(p=>{
    const cel = p.min+Math.floor(Math.random()*(p.max-p.min+1));
    return { id:p.id, kluc:p.kluc, cel, pari:p.pari, xp:p.xp,
      mk:p.mk(cel), en:p.en(cel), gotov:false, naplaten:false };
  });
  s.dnevno = { berba:0, zaraboteno:0, voda:0, hrana:0, prodadeno:0, naracki:0 };
}
function proveriPredizvici(){
  for (const c of s.predizvici){
    if (c.gotov) continue;
    if ((s.dnevno[c.kluc]||0) >= c.cel){
      c.gotov = true;
      if (!c.naplaten){ c.naplaten=true; dodadiPari(c.pari); dodadiXp(c.xp); }
    }
  }
}

/* ── Достигнувања ── */
function statVrednost(kluc){
  if (kluc==='staklenaOtklucena') return s.sobi.greenhouse.otklucena?1:0;
  if (kluc==='labOtklucena') return s.sobi.breeding_lab.otklucena?1:0;
  if (kluc==='nivo') return s.nivo;
  return s.statistika[kluc]||0;
}
let proverkaZakazana = false;
function proveriDostignuvanja(){
  if (proverkaZakazana) return;
  proverkaZakazana = true;
  setTimeout(()=>{
    proverkaZakazana = false;
    const novi = [];
    for (const a of DOSTIGNUVANJA)
      if (!s.dostignuvanja.includes(a.id) && statVrednost(a.stat)>=a.cel){
        s.dostignuvanja.push(a.id); novi.push(a);
      }
    if (novi.length){
      for (const a of novi) tost(T().toast_ach, s.jazik==='mk'?a.imeMk:a.imeEn);
      sfx('achievement');
      dodadiXp(novi.reduce((z,a)=>z+a.xp,0));
    }
    proveriPredizvici();
  }, 0);
}

/* ── Настани ── */
function pokreniNastan(){
  const ev = NASTANI_BAZEN[Math.floor(Math.random()*NASTANI_BAZEN.length)];
  s.aktivenNastan = ev.id;
  s.nastanTajmer = 100+Math.floor(Math.random()*80);
  const t = s.jazik;
  otvoriModal(`<div class="modal-bel">
    <div class="modal-naslov">${esc(t==='mk'?ev.mkT:ev.enT)}</div>
    <div class="modal-telo">${esc(t==='mk'?ev.mkO:ev.enO)}</div>
    ${ev.izbori.map((c,i)=>`<button class="izbor-red" onclick="resiNastan('${ev.id}',${i})">
      <span style="font:700 12px Inter,sans-serif">${esc(t==='mk'?c.mk:c.en)}</span></button>`).join('')}
  </div>`, true);
}
function resiNastan(evId, i){
  const ev = NASTANI_BAZEN.find(e=>e.id===evId);
  const c = ev && ev.izbori[i];
  s.aktivenNastan = null;
  zatvoriModal();
  if (!c){ iscrtajSe(true); return; }
  if (c.tip==='pari' || c.tip==='pariRizik')
    dodadiPari(Math.round(c.min + Math.random()*(c.max-c.min)));
  else if (c.tip==='prodazenBonus')
    s.prodazenBonus = { mult:c.mult, preostanato:c.broj };
  else if (c.tip==='zdravjeUdar'){
    if (s.rastenija.length){
      const p = s.rastenija[Math.floor(Math.random()*s.rastenija.length)];
      p.zdravje = Math.max(0, p.zdravje - (c.min+Math.random()*(c.max-c.min)));
    }
  }
  else if (c.tip==='semka'){
    if (c.cena>0){ if (s.pari<c.cena){ sfx('error'); iscrtajSe(true); return; } dodadiPari(-c.cena); }
    const zaklJucheni = siteSorti().filter(x=>!s.otkrieni.includes(x.id) && (x.hibrid || s.nivo < x.nivo));
    if (zaklJucheni.length){
      const izbor = zaklJucheni[Math.floor(Math.random()*zaklJucheni.length)];
      s.otkrieni.push(izbor.id);
    }
  }
  else if (c.tip==='prodajSe'){
    let vkupno=0;
    for (const id of Object.keys(s.zaliha))
      vkupno += (s.zaliha[id]||0) * sorta(id).cena * c.mult * (1+s.prestiz*0.05);
    s.zaliha={};
    dodadiPari(Math.round(vkupno));
  }
  sfx('click'); iscrtajSe(true);
}

/* ═══════════════════════════════════════════════════════════════
   6. МОТОР — тик од 1 секунда (како во дизајнот)
   ═══════════════════════════════════════════════════════════════ */
function tikni(){
  const dt = 1;

  // ── Раст на растенијата ──
  for (const p of s.rastenija){
    const x = sorta(p.sorta);
    const lampa = lampaNaSoba(p.soba);
    p.voda = Math.max(0, p.voda - KONFIG.VODA_PAD*dt);
    p.hrana = Math.max(0, p.hrana - KONFIG.HRANA_PAD*dt);
    if (p.voda<20 || p.hrana<20) p.zdravje = Math.max(0, p.zdravje-1.5*dt);
    else if (p.voda>50 && p.hrana>50) p.zdravje = Math.min(100, p.zdravje+0.8*dt);
    const stres = p.zdravje<40 ? 0.5 : 1;
    const rokSoba = SOBI.find(r=>r.id===p.soba);
    const growSec = Math.max(20, x.growSec * lampa.growMult * ((rokSoba&&rokSoba.growMult)||1));
    if (p.voda>0 && p.hrana>0) p.napredok = Math.min(1, p.napredok + (dt/growSec)*stres);
  }

  // ── Сушење и зреење (1 ден на сушење = SUSEN_DEN_SEK секунди) ──
  const tempo = dt / KONFIG.SUSEN_DEN_SEK;
  for (const b of s.susara){
    if (b.faza==='sushenje'){
      const preden = Math.floor(b.denovi);
      b.denovi += tempo;
      const novDen = Math.floor(b.denovi)!==preden;
      const pad = b.vlazenDen ? KONFIG.VLAGA_PAD_VLAZEN : KONFIG.VLAGA_PAD_DEN;
      b.vlaga = Math.max(KONFIG.VLAGA_MIN, b.vlaga - pad*tempo);
      if (b.denovi >= b.sledenoVrtenje && !b.trebaVrtenje){
        b.trebaVrtenje=true; b.vrtenjeRok=b.denovi+KONFIG.VRTENJE_ROK;
        b.sledenoVrtenje += KONFIG.VRTENJE_INTERVAL;
        poraka(T().t_turn);
      }
      if (b.trebaVrtenje && b.denovi > b.vrtenjeRok) b.trebaVrtenje=false;
      if (novDen){
        if (!b.vlazenDen && Math.random()<KONFIG.VLAZEN_SANSA_DEN){
          b.vlazenDen=true; poraka(T().t_humid, true);
        }
        if (!b.muvla && b.vlaga>KONFIG.MUVLA_PRAG && Math.random()<KONFIG.MUVLA_SANSA_DEN){
          b.muvla=true; b.imalaMuvla=true; poraka(T().t_mold, true);
        }
      }
      if (b.muvla) b.zaguba = Math.min(.6, b.zaguba + KONFIG.MUVLA_ZAGUBA_DEN*tempo);
    } else {
      const preden = Math.floor(b.denoviZreenje);
      b.denoviZreenje += tempo;
      if (Math.floor(b.denoviZreenje)!==preden) b.burpDostapen = true;
    }
  }

  personalRaboti(dt);

  // ── Ден и предизвици ──
  s.sekVoDen += dt;
  if (s.sekVoDen >= KONFIG.DEN_SEK){
    s.sekVoDen = 0; s.den++;
    s.naracki = s.naracki.filter(o=>o.istekuvaDen>s.den);
    // плати за персонал — дневен трошок
    let plati = 0;
    for (const def of PERSONAL) if (s.personal[def.kluc]) plati += def.plata;
    if (plati>0) s.pari = Math.max(0, s.pari - plati);
    novPredizvikDen();
  }
  s.statistika.sekundiIgrano += dt;

  moznaNaracka();

  if (!s.aktivenNastan && !s.tutorial){
    s.nastanTajmer -= dt;
    if (s.nastanTajmer<=0) pokreniNastan();
  }

  sejvAkumulator += dt;
  if (sejvAkumulator>=8){ sejvAkumulator=0; zachuvaj(); }

  proveriPredizvici();
  iscrtajSe(false);
}

      return `<div class="kart" style="padding:10px 12px">
        <div style="display:flex;justify-content:space-between;gap:6px;font:600 11.5px Inter,sans-serif;margin-bottom:5px">
          <span>${esc(s.jazik==='mk'?c.mk:c.en)}</span>
          <span style="color:oklch(50% 0.02 150);white-space:nowrap">${napr}/${c.cel}</span></div>
        <div class="lenta-h"><i style="width:${Math.min(100,napr/c.cel*100)}%;background:${c.gotov?'oklch(60% 0.11 152)':'oklch(66% 0.15 55)'}"></i></div>
      </div>`;}).join('')}
    </div></div>`;

  // Соби
  html += `<div class="sobi">${SOBI.map(r=>{
    const rs = s.sobi[r.id];
    const akt = s.aktivnaSoba===r.id;
    const kl = rs.otklucena ? (akt?'soba aktivna':'soba') : 'soba zakl';
    return `<button class="${kl}" onclick="premestiSoba('${r.id}')">
      <b>${esc(s.jazik==='mk'?r.imeMk:r.imeEn)}</b>
      ${rs.otklucena
        ? `<span>${esc(t.room_cap)}: ${r.laboratorija?'—':r.kapacitet}</span>`
        : `<span><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2"/></svg>${esc(t.room_unlock)} · ${fmtK(r.cenaOtklucuvanje)}</span>`}
    </button>`;}).join('')}</div>`;

  const sobaDef = SOBI.find(r=>r.id===s.aktivnaSoba);
  if (sobaDef && sobaDef.laboratorija){
    html += `<div class="kart" style="border-style:dashed;padding:30px;text-align:center;color:oklch(50% 0.02 150);font:600 12.5px Inter,sans-serif">
      ${esc(t.breed_hint)} → ${esc(t.nav_genetics)}</div></div>`;
    return html;
  }

  // Ламба
  const lampa = lampaNaSoba(s.aktivnaSoba);
  const slednaLampa = LAMBI[lampa.tier+1];
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap">
    <div style="font:700 12.5px Outfit,sans-serif">${esc(t.lamp)}: ${esc(s.jazik==='mk'?lampa.imeMk:lampa.imeEn)}</div>
    <button class="k-primarno" onclick="nadgradiLampa()" ${!slednaLampa?'disabled':''}
      style="${!slednaLampa||s.pari<slednaLampa.cena?'background:oklch(94% 0.015 90);color:oklch(60% 0.02 150)':''}">
      ${slednaLampa ? esc(t.lamp_upgrade)+' · '+fmtK(slednaLampa.cena) : esc(t.lamp_maxed)}</button>
  </div>`;

  // Растенија
  const rastenija = s.rastenija.filter(p=>p.soba===s.aktivnaSoba);
  html += `<div class="rast-mreza">`;
  for (const p of rastenija){
    const x = sorta(p.sorta);
    const stadium = p.napredok>=1 ? 4 : Math.min(3, Math.floor(p.napredok*4));
    const zrelo = p.napredok>=1;
    const vnimanie = p.voda<25 || p.hrana<25 || p.zdravje<50;
    const badge = t.badge[stadium];
    const badgeBg = zrelo ? 'linear-gradient(135deg,#fbbf24,#d97706)'
      : stadium>=2 ? 'oklch(92% 0.06 152)' : stadium===1 ? 'oklch(93% 0.03 230)' : 'oklch(94% 0.015 90)';
    const badgeBoja = zrelo ? '#2a1a00'
      : stadium>=2 ? 'oklch(35% 0.08 152)' : stadium===1 ? 'oklch(38% 0.08 230)' : 'oklch(50% 0.02 150)';
    html += `<div class="rast-kart">
      <div class="rast-glava"><span class="rast-ime">${esc(imeSorta(x))}</span>
        <span class="badge" style="background:${badgeBg};color:${badgeBoja}">${esc(badge)}</span></div>
      <div class="rast-scena">
        <div class="rast-sjaj" style="background:radial-gradient(circle,${esc(x.sjaj)},transparent 70%);opacity:${zrelo?.9:0}"></div>
        ${svgRastenie(p)}
        ${(p.plovki||[]).map(f=>`<div class="plovka" style="color:${esc(f.boja)}">${esc(f.tekst)}</div>`).join('')}
        ${vnimanie?'<div class="vnimanie"></div>':''}
      </div>
      <div class="rast-lenti">
        ${[['M12 3s7 8 7 13a7 7 0 1 1-14 0c0-5 7-13 7-13Z', p.voda],
           ['M12 2c1 4-4 5-4 9a4 4 0 0 0 8 0c0-2-1-3-1-3s2 1 2 5a6 6 0 1 1-12 0C5 8 9 7 12 2Z', p.hrana],
           ['M12 20s-7-4.5-9.5-9C1 8 2.5 4 6.5 4c2 0 3.5 1.2 4.5 2.5C12 5.2 13.5 4 15.5 4 19.5 4 21 8 19.5 11 17 15.5 12 20 12 20Z', p.zdravje]]
          .map(([d,v])=>`<div class="rast-lenta">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="${d}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span class="zica"><i style="width:${Math.round(v)}%;background:${bojaZaPct(v)}"></i></span>
            <u>${Math.round(v)}</u></div>`).join('')}
      </div>
      <div class="rast-akcii">
        <button class="k-voda" onclick="polej(${p.id})">${esc(t.water)}</button>
        <button class="k-hrana" onclick="nahrani(${p.id})">${esc(t.feed)}</button>
        <div class="berba-obvivka">
          <button class="k-berba" ${zrelo?'':'disabled'} onclick="otvoriIzborTrim(${p.id})"
            style="background:${zrelo?'linear-gradient(135deg,oklch(70% 0.14 55),oklch(62% 0.15 40))':'oklch(92% 0.01 90)'};color:${zrelo?'#fff':'oklch(60% 0.02 150)'}">
            ${esc(zrelo?t.harvest:t.growing)}</button>
          ${zrelo?'<div class="svetkanje"></div>':''}
        </div>
      </div>
    </div>`;
  }
  for (let i=rastenija.length; i<sobaDef.kapacitet; i++)
    html += `<button class="prazen-slot" onclick="otvoriIzborSorta('${sobaDef.id}')">${esc(t.empty_slot)}</button>`;
  html += `</div></div>`;
  return html;
}

function kartickaSerija(b){
  const t=T();
  const x = sorta(b.sorta);
  const masa = Math.max(1, Math.round(b.parcinja*(1-b.zaguba)));
  if (b.faza==='sushenje'){
    const vlaga = Math.round(b.vlaga);
    const boja = vlaga>KONFIG.MUVLA_PRAG ? '#ef4444'
               : vlaga>KONFIG.IDEAL_MAX ? '#f59e0b'
               : vlaga>=KONFIG.IDEAL_MIN ? '#22c55e' : '#60a5fa';
    const status = vlaga>KONFIG.MUVLA_PRAG ? t.hum_danger
                 : vlaga>KONFIG.VLAGA_TEGLI_MAX ? t.hum_wait
                 : vlaga>KONFIG.IDEAL_MAX ? t.hum_early
                 : vlaga>=KONFIG.IDEAL_MIN ? t.hum_ideal : t.hum_over;
    const mozе = b.vlaga<=KONFIG.VLAGA_TEGLI_MAX;
    return `<div class="kart" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
        <span style="font:700 13px Outfit,sans-serif">${esc(imeSorta(x))}</span>
        <span class="pil">${masa} × · ${esc(t.hangs)}</span></div>
      <div style="font:600 11px Inter,sans-serif;color:oklch(50% 0.02 150)">
        ${esc(t.hygro)}: <b style="color:${boja}">${vlaga}%</b> — ${esc(status)}<br>
        ${esc(t.day_n)} ${Math.floor(b.denovi)} · ${esc(t.pack_goal)}</div>
      <div class="lenta-h"><i style="width:${stegni((KONFIG.VLAGA_START-vlaga)/(KONFIG.VLAGA_START-KONFIG.VLAGA_MIN)*100,0,100)}%;background:oklch(66% 0.15 55)"></i></div>
      <div style="font:600 10px Inter,sans-serif;color:oklch(55% 0.02 150)">
        ${esc(t.sop)}: ${esc(b.potkrateno?t.trimmed:t.untrimmed)} · ${esc(t.turns)}: ${b.vrtenja}${b.trebaVrtenje?' '+esc(t.waiting):''}
        · ${esc(t.mold)}: ${esc(b.muvla?t.mold_active:b.imalaMuvla?t.mold_removed:t.mold_none)}
        ${b.zaguba>0?` · ${esc(t.loss)} ${Math.round(b.zaguba*100)}%`:''}</div>
      ${b.muvla?`<button class="k-crveno" onclick="otstraniMuvla(${b.id})">${esc(t.remove_mold)} · −${Math.round(KONFIG.MUVLA_CISTENJE*100)}%</button>`:''}
      ${b.vlazenDen?`<button class="k-crveno" onclick="provetri(${b.id})">${esc(t.vent)}</button>`:''}
      ${b.trebaVrtenje?`<button class="k-zlatno" onclick="zavrtiGranki(${b.id})">${esc(t.turn_now)}</button>`:''}
      <button class="k-primarno" ${mozе?'':'disabled'} onclick="spakuvaj(${b.id})">
        ${esc(mozе?t.pack:t.pack_disabled)}</button>
    </div>`;
  }
  const dZr = Math.floor(b.denoviZreenje);
  const gotovo = b.denoviZreenje >= KONFIG.ZREENJE_MIN;
  return `<div class="kart" style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
      <span style="font:700 13px Outfit,sans-serif">${esc(imeSorta(x))}</span>
      <span class="pil">${masa} × · ${esc(t.in_jars)}</span></div>
    <div style="font:600 11px Inter,sans-serif;color:oklch(50% 0.02 150)">
      ${esc(sablon(t.cure_day, dZr))} · ${esc(t.packed_acc)} ${(b.tochnost*100).toFixed(0)}%<br>
      ${esc(t.burps)}: ${b.burpovi} ${esc(sablon(t.of_possible, Math.max(dZr+1,1)))}</div>
    <div class="lenta-h"><i style="width:${stegni(b.denoviZreenje/KONFIG.ZREENJE_MIN*100,0,100)}%;background:oklch(60% 0.11 152)"></i></div>
    <div style="font:600 10px Inter,sans-serif;color:oklch(55% 0.02 150)">
      ${esc(t.sop)}: ${esc(b.potkrateno?t.trimmed:t.untrimmed)} · ${esc(t.turns)} ${b.vrtenja}
      · ${esc(t.mold)}: ${esc(b.imalaMuvla?t.mold_had:t.mold_none)}</div>
    ${b.burpDostapen?`<button class="k-zlatno" onclick="burpni(${b.id})">${esc(t.burp)}</button>`:''}
    <button class="k-primarno" ${gotovo?'':'disabled'} onclick="zavrsiZreenje(${b.id})">
      ${esc(gotovo?t.finish_cure:sablon(t.cures_more, Math.max(0,Math.ceil(KONFIG.ZREENJE_MIN-b.denoviZreenje))))}</button>
  </div>`;
}

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2"/></svg>

function panelPazar(){
  const t=T();
  const redovi = Object.keys(s.zaliha).filter(id=>s.zaliha[id]>0);
  const bonus = s.prodazenBonus && s.prodazenBonus.preostanato>0;
  let html = `<div class="panel tesen">
    <div class="naslov">${esc(t.market_title)}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap">
      <div class="sekcija" style="margin:0">${esc(t.inventory)}</div>
      ${bonus?`<span style="font:700 10px Inter,sans-serif;background:linear-gradient(135deg,#fbbf24,#d97706);color:#2a1a00;padding:3px 9px;border-radius:20px">+${Math.round((s.prodazenBonus.mult-1)*100)}% × ${s.prodazenBonus.preostanato}</span>`:''}
      <button class="k-primarno" onclick="prodajSe()">${esc(t.sell_all_inv)}</button>
    </div>`;
  if (!redovi.length)
    html += `<div class="kart" style="border-style:dashed;padding:20px;text-align:center;color:oklch(55% 0.02 150);font:600 12px Inter,sans-serif;margin-bottom:22px">${esc(t.inventory_empty)}</div>`;
  else {
    html += `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:26px">`;
    for (const id of redovi){
      const x = sorta(id), kolku = s.zaliha[id];
      const cena = Math.round(x.cena * prodazenMult());
      html += `<div class="kart" style="padding:10px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="gtocka" style="background:${esc(x.sjaj)}"></span>
        <div style="flex:1;min-width:110px">
          <div style="font:700 12px Outfit,sans-serif">${esc(imeSorta(x))}</div>
          <div style="font:600 10px Inter,sans-serif;color:oklch(55% 0.02 150)">${kolku} × ${fmt(cena)} ден</div></div>
        <div style="font:800 12.5px Outfit,sans-serif;color:oklch(38% 0.06 152);white-space:nowrap">${fmt(cena*kolku)} ден</div>
        <button class="k-sekundarno" style="padding:6px 11px;font-size:10px" onclick="prodaj('${esc(id)}',1)">${esc(t.sell_one)}</button>
        <button class="k-primarno" style="padding:6px 11px;font-size:10px" onclick="prodaj('${esc(id)}',${kolku})">${esc(t.sell_all)}</button>
      </div>`;
    }
    html += `</div>`;
  }
  html += `<div class="sekcija">${esc(t.orders)}</div>`;
  if (!s.naracki.length)
    html += `<div class="kart" style="border-style:dashed;padding:20px;text-align:center;color:oklch(55% 0.02 150);font:600 12px Inter,sans-serif">${esc(t.orders_empty)}</div>`;
  else {
    html += `<div class="kart-mreza" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">`;
    for (const n of s.naracki){
      const x = sorta(n.sorta), ima = s.zaliha[n.sorta]||0, moze = ima>=n.kolku;
      html += `<div class="kart">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <span style="font:700 12.5px Outfit,sans-serif">${esc(imeSorta(x))}</span>
          <span style="font:600 9.5px Inter,sans-serif;color:oklch(55% 0.02 150)">${esc(t.expires)} ${n.istekuvaDen}</span></div>
        <div style="font:600 10.5px Inter,sans-serif;color:oklch(50% 0.02 150);margin-bottom:4px">${esc(t.have)} ${ima}/${n.kolku}</div>
        <div class="lenta-h" style="margin-bottom:8px"><i style="width:${Math.min(100,ima/n.kolku*100)}%;background:oklch(60% 0.11 152)"></i></div>
        <div style="font:700 11px Inter,sans-serif;color:oklch(38% 0.06 152);margin-bottom:10px">${esc(t.reward)}: ${fmt(n.pari)} ден · +${n.xp} XP</div>
        <button class="k-primarno" style="width:100%" ${moze?'':'disabled'} onclick="ispolniNaracka(${n.id})">
          ${esc(moze?t.fulfill:t.not_enough)}</button>
      </div>`;
    }
    html += `</div>`;
  }
  return html + `</div>`;
}

    ${DOSTIGNUVANJA.map(a=>{
      const otkl = s.dostignuvanja.includes(a.id);
      const sega = Math.min(a.cel, statVrednost(a.stat));
      return `<div class="kart" style="opacity:${otkl?1:.85}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px">
          <span style="font:700 12.5px Outfit,sans-serif">${esc(s.jazik==='mk'?a.imeMk:a.imeEn)}</span>
          ${otkl?`<span style="width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#d97706);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="#2a1a00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`:''}
        </div>
        <div style="font:500 11px Inter,sans-serif;color:oklch(50% 0.02 150);margin-bottom:8px;line-height:1.5">${esc(s.jazik==='mk'?a.opisMk:a.opisEn)}</div>
        ${otkl
          ? `<div style="font:700 10px Inter,sans-serif;color:oklch(45% 0.09 152)">+${a.xp} XP</div>`
          : `<div class="lenta-h" style="margin-bottom:4px"><i style="width:${Math.min(100,sega/a.cel*100)}%;background:oklch(66% 0.15 55)"></i></div>
             <div style="font:600 9.5px Inter,sans-serif;color:oklch(58% 0.02 150)">${sega}/${a.cel}</div>`}
      </div>`;}).join('')}
    </div>
  </div>`;
}

function panelPrestiz(){
  const t=T();
  const moze = s.nivo>=10;
  return `<div class="panel" style="max-width:640px">
    <div style="background:linear-gradient(160deg,#16241c 0%,#0c1310 70%);border-radius:20px;padding:32px 26px;color:#e9f3ec;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)">
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#d97706);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="color:#2a1a00"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div style="font:800 19px Outfit,sans-serif;margin-bottom:8px">${esc(t.pr_title)}</div>
      <div style="font:500 12.5px Inter,sans-serif;color:rgba(233,243,236,.7);max-width:400px;margin:0 auto 20px;line-height:1.6">${esc(t.pr_desc)}</div>
      <div style="display:flex;justify-content:center;gap:30px;margin-bottom:22px">
        <div><div style="font:800 22px Outfit,sans-serif;color:#fbbf24">${s.prestiz}</div>
          <div style="font:600 9px Inter,sans-serif;text-transform:uppercase;letter-spacing:.4px;color:rgba(233,243,236,.55)">${esc(t.pr_points)}</div></div>
        <div><div style="font:800 22px Outfit,sans-serif;color:#fbbf24">+${s.prestiz*5}%</div>
          <div style="font:600 9px Inter,sans-serif;text-transform:uppercase;letter-spacing:.4px;color:rgba(233,243,236,.55)">${esc(t.pr_mult)}</div></div>
      </div>
      ${moze
        ? `<button onclick="otvoriPrestizPotvrda()" style="padding:13px 28px;border-radius:14px;font:800 13px Outfit,sans-serif;background:linear-gradient(135deg,#fbbf24,#d97706);color:#2a1a00">${esc(t.pr_btn)}</button>`
        : `<div style="font:600 11.5px Inter,sans-serif;color:rgba(233,243,236,.5)">${esc(t.pr_req)} 10</div>`}
    </div>
  </div>`;
}

let posledenPanelHtml = '';
function iscrtajSe(prisilno){
  osveziHud();
  osveziNav();
  const paneli = { grow:panelGrow, drying:panelSusenje, curing:panelZreenje,
    genetics:panelGenetika, market:panelPazar, staff:panelPersonal,
    achievements:panelDostignuvanja, prestige:panelPrestiz };
  const fn = paneli[s.aktivnoJazice] || panelGrow;
  const html = fn();
  if (prisilno || html !== posledenPanelHtml){
    posledenPanelHtml = html;
    document.getElementById('glavno').innerHTML = html;
  }
}

/* ═══════════════════════════════════════════════════════════════
   8. ЗАЧУВУВАЊЕ
   ═══════════════════════════════════════════════════════════════ */
function zachuvaj(){
  try{
    const kopija = {...s, tutorial:false, aktivenNastan:null};
    localStorage.setItem(KONFIG.KLUC_SEJV, JSON.stringify({s:kopija, sledenId}));
  }catch(e){}
}
function broj(v, def, min, max){
  return Number.isFinite(Number(v)) ? stegni(Number(v), min, max) : def;
}
function vchitaj(){
  let surovo;
  try{ surovo = localStorage.getItem(KONFIG.KLUC_SEJV); }catch(e){ return false; }
  if (!surovo) return false;
  let paket;
  try{ paket = JSON.parse(surovo); }catch(e){ return false; }
  const z = paket && paket.s;
  if (!z || typeof z!=='object' || z.verzija!==KONFIG.VERZIJA) return false;

  const svez = novaIgra();
  s = svez;
  s.jazik = z.jazik==='en' ? 'en' : 'mk';
  s.zvuk = z.zvuk!==false;
  s.aktivnoJazice = JAZICINJA.some(j=>j.id===z.aktivnoJazice) ? z.aktivnoJazice : 'grow';
  s.aktivnaSoba = SOBI.some(r=>r.id===z.aktivnaSoba) ? z.aktivnaSoba : 'starter';
  s.pari = broj(z.pari, KONFIG.POCETNI_PARI, 0, 1e12);
  s.xp = broj(z.xp, 0, 0, 1e12);
  s.nivo = Math.floor(broj(z.nivo, 1, 1, 999));
  s.prestiz = Math.floor(broj(z.prestiz, 0, 0, 1e6));
  s.den = Math.floor(broj(z.den, 1, 1, 1e9));
  s.sekVoDen = broj(z.sekVoDen, 0, 0, KONFIG.DEN_SEK);
  for (const r of SOBI){
    const zr = z.sobi && z.sobi[r.id];
    s.sobi[r.id] = { otklucena: r.id==='starter' ? true : !!(zr&&zr.otklucena),
      lampa: Math.floor(broj(zr&&zr.lampa, 0, 0, LAMBI.length-1)) };
  }
  // Хибриди: провери структура; имињата се екранизираат при цртање (esc)
  s.hibridi = Array.isArray(z.hibridi) ? z.hibridi.filter(h =>
    h && typeof h.id==='string' && Number.isFinite(h.cena) && Number.isFinite(h.prinos)
    && Number.isFinite(h.growSec)).map(h => ({
      id:h.id, imeMk:String(h.imeMk||'?'), imeEn:String(h.imeEn||'?'),
      tier:Math.floor(broj(h.tier,1,1,5)), growSec:broj(h.growSec,60,20,600),
      prinos:Math.floor(broj(h.prinos,1,1,99)), cena:Math.floor(broj(h.cena,1,1,999)),
      nivo:Math.floor(broj(h.nivo,1,1,99)), sjaj:/^#[0-9a-fA-F]{6}$/.test(h.sjaj)?h.sjaj:'#c084fc',
      hibrid:true })) : [];
  s.otkrieni = Array.isArray(z.otkrieni) ? z.otkrieni.filter(id=>siteSorti().some(x=>x.id===id)) : [];
  s.rastenija = Array.isArray(z.rastenija) ? z.rastenija.filter(p =>
    p && siteSorti().some(x=>x.id===p.sorta) && SOBI.some(r=>r.id===p.soba)).map(p=>({
      id:Math.floor(broj(p.id,1,1,1e9)), soba:p.soba, sorta:p.sorta,
      voda:broj(p.voda,100,0,100), hrana:broj(p.hrana,100,0,100),
      zdravje:broj(p.zdravje,100,0,100), napredok:broj(p.napredok,0,0,1), plovki:[] })) : [];
  s.sledenRastenieId = Math.max(Math.floor(broj(z.sledenRastenieId,1,1,1e9)),
    ...s.rastenija.map(p=>p.id+1), 1);
  s.susara = Array.isArray(z.susara) ? z.susara.filter(b =>
    b && siteSorti().some(x=>x.id===b.sorta)).map(b=>({
      id:Math.floor(broj(b.id,1,1,1e9)), sorta:b.sorta,
      parcinja:Math.floor(broj(b.parcinja,1,1,9999)),
      faza:b.faza==='zreenje'?'zreenje':'sushenje',
      denovi:broj(b.denovi,0,0,1e4), vlaga:broj(b.vlaga,KONFIG.VLAGA_START,KONFIG.VLAGA_MIN,KONFIG.VLAGA_START),
      potkrateno:!!b.potkrateno, vrtenja:Math.floor(broj(b.vrtenja,0,0,999)),
      trebaVrtenje:!!b.trebaVrtenje, vrtenjeRok:broj(b.vrtenjeRok,0,0,1e4),
      sledenoVrtenje:broj(b.sledenoVrtenje,KONFIG.VRTENJE_INTERVAL,0,1e4),
      muvla:!!b.muvla, imalaMuvla:!!b.imalaMuvla, zaguba:broj(b.zaguba,0,0,.6),
      vlazenDen:!!b.vlazenDen, tochnost:broj(b.tochnost,0,0,1),
      denoviZreenje:broj(b.denoviZreenje,0,0,1e4),
      burpovi:Math.floor(broj(b.burpovi,0,0,999)), burpDostapen:!!b.burpDostapen })) : [];
  sledenId = Math.max(Math.floor(broj(paket.sledenId,1,1,1e9)), ...s.susara.map(b=>b.id+1), 1);
  s.zaliha = {};
  if (z.zaliha) for (const [id,n] of Object.entries(z.zaliha))
    if (siteSorti().some(x=>x.id===id) && Number.isFinite(n) && n>0)
      s.zaliha[id] = Math.floor(stegni(n,0,1e9));
  for (const def of PERSONAL) s.personal[def.kluc] = !!(z.personal && z.personal[def.kluc]);
  s.dostignuvanja = Array.isArray(z.dostignuvanja)
    ? z.dostignuvanja.filter(id=>DOSTIGNUVANJA.some(a=>a.id===id)) : [];
  s.naracki = Array.isArray(z.naracki) ? z.naracki.filter(n =>
    n && siteSorti().some(x=>x.id===n.sorta) && Number.isFinite(n.kolku) && Number.isFinite(n.pari)).map(n=>({
      id:Math.floor(broj(n.id,1,1,1e9)), sorta:n.sorta, kolku:Math.floor(stegni(n.kolku,1,999)),
      pari:Math.floor(stegni(n.pari,0,1e9)), xp:Math.floor(broj(n.xp,0,0,1e6)),
      istekuvaDen:Math.floor(broj(n.istekuvaDen,s.den+1,1,1e9)) })) : [];
  s.slednaNarackaId = Math.max(Math.floor(broj(z.slednaNarackaId,1,1,1e9)), ...s.naracki.map(n=>n.id+1), 1);
  if (z.dnevno) for (const k of Object.keys(s.dnevno)) s.dnevno[k] = broj(z.dnevno[k],0,0,1e9);
  s.predizvici = Array.isArray(z.predizvici) ? z.predizvici.filter(c =>
    c && PREDIZVICI_BAZEN.some(p=>p.id===c.id) && Number.isFinite(c.cel)).map(c=>({
      id:c.id, kluc:String(c.kluc||''), cel:Math.floor(stegni(c.cel,1,1e6)),
      pari:Math.floor(broj(c.pari,0,0,1e6)), xp:Math.floor(broj(c.xp,0,0,1e6)),
      mk:String(c.mk||''), en:String(c.en||''), gotov:!!c.gotov, naplaten:!!c.naplaten })) : [];
  if (z.statistika) for (const k of Object.keys(s.statistika)){
    if (k==='berbiPoSorta'){
      s.statistika.berbiPoSorta = {};
      if (z.statistika.berbiPoSorta)
        for (const [id,n] of Object.entries(z.statistika.berbiPoSorta))
          if (siteSorti().some(x=>x.id===id) && Number.isFinite(n))
            s.statistika.berbiPoSorta[id] = Math.floor(stegni(n,0,1e9));
    } else s.statistika[k] = broj(z.statistika[k], 0, 0, 1e12);
  }
  s.tutorial = false;
  prikazPari = s.pari; prikazXp = s.xp;
  return true;
}

/* ═══════════════════════════════════════════════════════════════
   9. СТАРТ
   ═══════════════════════════════════════════════════════════════ */
document.getElementById('jaz-mk').addEventListener('click', ()=>{ s.jazik='mk'; sfx('click'); iscrtajSe(true); });
document.getElementById('jaz-en').addEventListener('click', ()=>{ s.jazik='en'; sfx('click'); iscrtajSe(true); });
document.getElementById('k-zvuk').addEventListener('click', ()=>{ s.zvuk=!s.zvuk; sfx('click'); osveziHud(); });
document.getElementById('k-tutorial').addEventListener('click', ()=>{ s.tutorial=true; tutorial(0); });
document.getElementById('pokrivka').addEventListener('click', e=>{
  if (e.target.id==='pokrivka' && !e.currentTarget.dataset.fiksno) zatvoriModal();
});
document.addEventListener('keydown', e=>{
  const p = document.getElementById('pokrivka');
  if (e.key==='Escape' && p.classList.contains('otvorena') && !p.dataset.fiksno) zatvoriModal();
});
window.addEventListener('beforeunload', zachuvaj);

const imaSejv = vchitaj();
if (!imaSejv) novPredizvikDen();
iscrtajSe(true);
if (!imaSejv && s.tutorial) tutorial(0);

setInterval(tikni, 1000);
// мека анимација на бројачите за пари и XP
(function tvin(){
  let mrdna = false;
  if (Math.abs(prikazPari-s.pari)>0.5){ prikazPari += (s.pari-prikazPari)*0.18; mrdna=true; }
  else if (prikazPari!==s.pari){ prikazPari = s.pari; mrdna=true; }
  if (Math.abs(prikazXp-s.xp)>0.5){ prikazXp += (s.xp-prikazXp)*0.18; mrdna=true; }
  else if (prikazXp!==s.xp){ prikazXp = s.xp; mrdna=true; }
  if (mrdna) osveziHud();
  requestAnimationFrame(tvin);
})();

/* Кука за автоматска проверка. */
window.__test = {
  daj: ()=>s,
  tikni, brzoNapred(n){ for(let i=0;i<n;i++) tikni(); },
  zasadi, polej, nahrani, oberi, otvoriIzborTrim,
  zavrtiGranki, provetri, otstraniMuvla, spakuvaj, burpni, zavrsiZreenje,
  vkrsti, izberiZaVkrstuvanje, prodaj, prodajSe, ispolniNaracka,
  vraboti, otklucSoba, nadgradiLampa, prerodiSe, resiNastan,
  zachuvaj, vchitaj, novaIgra,
  resetiraj(){ s = novaIgra(); s.tutorial=false; sledenId=1; izborVkrstuvanje=[];
    prikazPari=s.pari; prikazXp=s.xp; personalAkumulator={}; novPredizvikDen();
    zatvoriModal(); iscrtajSe(true); }
};
